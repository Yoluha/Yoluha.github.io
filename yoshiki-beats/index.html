  document.getElementById('sortViews').textContent = T.sortViews[lang];
  document.getElementById('sortLikes').textContent = T.sortLikes[lang];
  document.getElementById('tabMusic').textContent = T.tabMusic[lang];
  document.getElementById('tabVideo').textContent = T.tabVideo[lang];
  document.getElementById('tlMore').textContent = activeTab === 'music' ? T.tlMoreMusic[lang] : T.tlMore[lang];
  document.getElementById('linksHeading').textContent = T.linksHeading[lang];
  document.getElementById('linkPortfolioLabel').textContent = T.linkPortfolio[lang];
  document.getElementById('footerContact').textContent = T.footerContact[lang];
  document.getElementById('stripLabel').textContent = T.stripLabel[lang];
  document.getElementById('cardHorasDesc').textContent = T.cardHorasDesc[lang];
  document.getElementById('cardJcDesc').textContent = T.cardJcDesc[lang];
  document.getElementById('card3dDesc').textContent = T.card3dDesc[lang];
  document.getElementById('cardSynthDesc').textContent = T.cardSynthDesc[lang];
  document.getElementById('cardListaDesc').textContent = T.cardListaDesc[lang];
  document.getElementById('prevBtn').title = T.prevTrackTitle[lang];
  document.getElementById('nextBtn').title = T.nextTrackTitle[lang];
  document.getElementById('radioBtn').title = T.radioTitle[lang];

  const sel = document.getElementById('langSelect');
  if (sel && sel.value !== lang) sel.value = lang;
  try { localStorage.setItem('yoluha-lang', lang); } catch (e) {}

  renderTracks();
  fitProjLabel();
}

function fitProjLabel() {
  const el = document.getElementById('stripLabel');
  if (!el) return;
  el.style.fontSize = '';
  const range = document.createRange();
  range.selectNodeContents(el);
  const natural = range.getBoundingClientRect().height;
  if (!natural) return;
  let scale = 90 / natural;
  scale = Math.max(0.7, Math.min(scale, 2.2));
  let rem = 0.5 * scale;
  rem = Math.max(0.38, Math.min(rem, 0.95));
  el.style.fontSize = rem.toFixed(3) + 'rem';
}

function scrollProjStrip(btn, dir) {
  const strip = btn.parentElement.querySelector('.proj-strip');
  const card = strip.querySelector('.proj-card-sm');
  const step = card ? card.offsetWidth + 9 : 150;
  strip.scrollBy({ left: dir * step * 2, behavior: 'smooth' });
}
function updateProjNav(strip) {
  const viewport = strip.parentElement;
  const prev = viewport.querySelector('.proj-nav-prev');
  const next = viewport.querySelector('.proj-nav-next');
  if (!prev || !next) return;
  const max = strip.scrollWidth - strip.clientWidth;
  const scrollable = max > 2;
  prev.hidden = !scrollable || strip.scrollLeft <= 2;
  next.hidden = !scrollable || strip.scrollLeft >= max - 2;
}
document.querySelectorAll('.proj-strip').forEach(updateProjNav);
window.addEventListener('resize', () => document.querySelectorAll('.proj-strip').forEach(updateProjNav));

function toggleProjStrip() {
  const wrap = document.getElementById('projStripWrap');
  const btn = document.getElementById('projStripToggle');
  const collapsed = wrap.classList.toggle('collapsed');
  btn.textContent = collapsed ? '▾' : '▴';
  try { localStorage.setItem('yoluha-strip-collapsed', collapsed ? '1' : '0'); } catch (e) {}
}

(function () {
  const sel = document.getElementById('langSelect');
  sel.innerHTML = LANG_ORDER.map(code => `<option value="${code}">${LANG_NAMES[code]}</option>`).join('');

  var saved = null;
  try { saved = localStorage.getItem('yoluha-lang'); } catch (e) {}
  var browserLang = (navigator.language || 'pt').slice(0, 2);
  var initial = saved || (LANG_ORDER.includes(browserLang) ? browserLang : 'pt');
  setLang(initial);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitProjLabel);
  }
})();

(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const blobs = Array.from(document.querySelectorAll('.aurora .blob'));
  if (!blobs.length) return;

  const PUSH_RADIUS = 200;
  const PUSH_STRENGTH = 90;
  let homes = [];

  function measureHomes() {
    homes = blobs.map(el => {
      const r = (el.querySelector('span') || el).getBoundingClientRect();
      return { el, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
    });
  }
  measureHomes();
  window.addEventListener('resize', measureHomes);

  function pushFrom(px, py) {
    homes.forEach(h => {
      const dx = h.cx - px;
      const dy = h.cy - py;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist < PUSH_RADIUS) {
        const force = (1 - dist / PUSH_RADIUS) * PUSH_STRENGTH;
        h.el.style.transform = `translate(${(dx / dist) * force}px, ${(dy / dist) * force}px)`;
      } else {
        h.el.style.transform = 'translate(0, 0)';
      }
    });
  }
  function release() {
    homes.forEach(h => { h.el.style.transform = 'translate(0, 0)'; });
  }

  window.addEventListener('mousemove', (e) => pushFrom(e.clientX, e.clientY));
  window.addEventListener('mouseleave', release);
  window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) pushFrom(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchend', release);
})();

// ---------- Track list ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function formatCount(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

// ---------- Player + background/lock-screen playback ----------
function updateMediaSession(track) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: SITE_ARTIST_NAME,
      album: activeTab === 'music' ? 'YouTube Music' : 'YouTube',
      artwork: [
        { src: `https://i.ytimg.com/vi/${track.id}/mqdefault.jpg`, sizes: '320x180', type: 'image/jpeg' },
        { src: `https://i.ytimg.com/vi/${track.id}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' },
      ],
    });
    navigator.mediaSession.setActionHandler('play', () => ytPlayer && ytPlayer.playVideo());
    navigator.mediaSession.setActionHandler('pause', () => ytPlayer && ytPlayer.pauseVideo());
    navigator.mediaSession.setActionHandler('previoustrack', () => playAdjacent(-1));
    navigator.mediaSession.setActionHandler('nexttrack', () => playAdjacent(1));
  } catch (e) { /* MediaMetadata not supported */ }
}

function randomPick(pool) {
  if (pool.length === 1) return pool[0];
  let pick;
  do { pick = pool[Math.floor(Math.random() * pool.length)]; } while (pick.id === activeVideoId);
  return pick;
}

function startRadio() {
  const pool = filteredItems();
  if (!pool.length) return;
  radioMode = true;
  renderedItems = pool;
  const first = randomPick(pool);
  radioHistory = [first];
  radioHistoryIndex = 0;
  playVideo(first.id, first.title);
}

function radioStep(dir) {
  const pool = filteredItems();
  if (!pool.length) return;
  if (dir < 0 && radioHistoryIndex > 0) {
    radioHistoryIndex -= 1;
  } else {
    const next = randomPick(pool);
    radioHistory = radioHistory.slice(0, radioHistoryIndex + 1);
    radioHistory.push(next);
    radioHistoryIndex = radioHistory.length - 1;
  }
  const track = radioHistory[radioHistoryIndex];
  playVideo(track.id, track.title);
}

function playAdjacent(dir) {
  if (radioMode) { radioStep(dir); return; }
  if (!renderedItems.length) return;
  const idx = renderedItems.findIndex(v => v.id === activeVideoId);
  const next = renderedItems[(idx + dir + renderedItems.length) % renderedItems.length];
  if (next) playVideo(next.id, next.title);
}

function onYouTubeIframeAPIReady() {
  ytApiReady = true;
  ytPlayer = new YT.Player('playerFrame', {
    videoId: activeVideoId,
    playerVars: { rel: 0, playsinline: 1 },
    events: {
      onReady: () => updateMediaSession({ id: activeVideoId, title: document.getElementById('nowPlayingTitle').textContent }),
      onStateChange: (e) => {
        if (!('mediaSession' in navigator)) return;
        if (e.data === YT.PlayerState.PLAYING) navigator.mediaSession.playbackState = 'playing';
        else if (e.data === YT.PlayerState.PAUSED) navigator.mediaSession.playbackState = 'paused';
        else if (e.data === YT.PlayerState.ENDED) playAdjacent(1);
      },
    },
  });
  if (pendingVideo) {
    ytPlayer.loadVideoById(pendingVideo.id);
    pendingVideo = null;
  }
}

function playVideo(id, title) {
  activeVideoId = id;
  document.getElementById('nowPlayingTitle').textContent = title;
  if (ytApiReady && ytPlayer && ytPlayer.loadVideoById) {
    ytPlayer.loadVideoById(id);
  } else {
    pendingVideo = { id, title };
  }
  updateMediaSession({ id, title });
  document.querySelector('.player').scrollIntoView({ behavior: 'smooth', block: 'start' });
  renderTracks();
}

function currentItems() {
  return activeTab === 'music' ? ALL_SONGS : ALL_VIDEOS;
}

// J-Trap, GΛRĀN and Djent get their own filter chip; every other genre tag
// (J-Metal, Kami Phonk, whatever a future data refresh adds...) collapses
// into one shared "Outros" chip so the filter bar stays short.
const GENRE_KEEP = new Set(['J-Trap', 'GΛRĀN', 'Djent']);
const GENRE_OTHER_KEY = '__other__';
function genreKey(g) { return GENRE_KEEP.has(g) ? g : GENRE_OTHER_KEY; }
function genreLabel(key) { return key === GENRE_OTHER_KEY ? T.otherGenres[currentLang] : key; }

function filteredItems() {
  return currentItems().filter(v => {
    if (tlState.genres.size && !tlState.genres.has(genreKey(v.genre))) return false;
    if (tlState.query && !v.title.toLowerCase().includes(tlState.query)) return false;
    return true;
  });
}

function renderTracks() {
  const list = document.getElementById('trackList');
  const countEl = document.getElementById('tlCount');
  if (!list) return;

  const all = currentItems();
  let items;
  if (radioMode) {
    items = renderedItems;
  } else {
    items = filteredItems();
    if (activeTab === 'music') {
      items.sort((a, b) => (b.plays || 0) - (a.plays || 0));
    } else {
      items.sort((a, b) => {
        if (tlState.sort === 'views') return (b.views || 0) - (a.views || 0);
        if (tlState.sort === 'likes') return (b.likes || 0) - (a.likes || 0);
        return (a.order ?? 0) - (b.order ?? 0);
      });
    }
    renderedItems = items;
  }

  countEl.textContent = `${items.length} / ${all.length}`;
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = `<p class="track-empty">${T.trackEmpty[currentLang]}</p>`;
    return;
  }
  items.forEach(v => {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'track-row' + (v.id === activeVideoId ? ' active' : '');
    const stats = activeTab === 'music'
      ? `▶ ${formatCount(v.plays || 0)}`
      : `👁 ${formatCount(v.views || 0)} · ♥ ${formatCount(v.likes || 0)}`;
    row.innerHTML = `
      <img class="track-thumb" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy">
      <span class="track-main">
        <span class="track-title">${escapeHtml(v.title)}</span>
        ${v.genre ? `<span class="track-genre-pill">${escapeHtml(v.genre)}</span>` : ''}
      </span>
      <span class="track-stats">${stats}</span>
    `;
    row.addEventListener('click', () => playVideo(v.id, v.title));
    list.appendChild(row);
  });
}

function renderGenreChips() {
  const wrap = document.getElementById('tlGenres');
  const keys = new Set(currentItems().map(v => v.genre).filter(Boolean).map(genreKey));
  const orderedKeys = ['J-Trap', 'GΛRĀN', 'Djent', GENRE_OTHER_KEY].filter(k => keys.has(k));
  if (orderedKeys.length < 2) { wrap.hidden = true; return; }
  wrap.hidden = false;
  wrap.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.type = 'button';
  allChip.className = 'tl-chip active';
  allChip.textContent = T.allGenres[currentLang];
  allChip.dataset.genre = 'all';
  wrap.appendChild(allChip);
  orderedKeys.forEach(k => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'tl-chip';
    chip.textContent = genreLabel(k);
    chip.dataset.genre = k;
    wrap.appendChild(chip);
  });
  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.tl-chip');
    if (!btn) return;
    radioMode = false;
    tlState.genres = btn.dataset.genre === 'all' ? new Set() : new Set([btn.dataset.genre]);
    syncGenreActiveUI();
    renderTracks();
  });
}

function syncGenreActiveUI() {
  document.querySelectorAll('#tlGenres .tl-chip').forEach(c => {
    const isAll = c.dataset.genre === 'all';
    c.classList.toggle('active', isAll ? tlState.genres.size === 0 : (tlState.genres.size === 1 && tlState.genres.has(c.dataset.genre)));
  });
  document.querySelectorAll('.hero-bar .genre-pill').forEach(p => p.classList.toggle('active', tlState.genres.has(p.dataset.genre)));
}

function filterByGenre(genre, btn) {
  radioMode = false;
  if (activeTab !== 'music') setTab('music');
  if (tlState.genres.has(genre)) tlState.genres.delete(genre);
  else tlState.genres.add(genre);
  syncGenreActiveUI();
  renderTracks();
  if (btn) {
    btn.classList.remove('blink');
    void btn.offsetWidth;
    btn.classList.add('blink');
  }
}

function setTab(tab) {
  if (tab === activeTab) return;
  radioMode = false;
  activeTab = tab;
  tlState.genres = new Set();
  tlState.query = '';
  document.getElementById('tlSearch').value = '';
  document.getElementById('tabMusic').classList.toggle('active', tab === 'music');
  document.getElementById('tabVideo').classList.toggle('active', tab === 'video');
  document.getElementById('tlSort').hidden = tab === 'music';
  document.getElementById('tlMore').href = tab === 'music' ? YT_MUSIC_URL : YT_VIDEOS_URL;
  document.getElementById('tlMore').textContent = tab === 'music' ? T.tlMoreMusic[currentLang] : T.tlMore[currentLang];
  renderGenreChips();
  syncGenreActiveUI();
  renderTracks();
}

document.getElementById('tabMusic').addEventListener('click', () => setTab('music'));
document.getElementById('tabVideo').addEventListener('click', () => setTab('video'));

Promise.all([
  fetch('songs.json').then(r => r.ok ? r.json() : []).catch(() => []),
  fetch('videos.json').then(r => r.ok ? r.json() : []).catch(() => []),
]).then(([songs, videos]) => {
  ALL_SONGS = Array.isArray(songs) ? songs : [];
  ALL_VIDEOS = Array.isArray(videos) ? videos : [];
  if (!ALL_SONGS.length && !ALL_VIDEOS.length) return;
  if (!ALL_SONGS.length) setTab('video');
  document.getElementById('tabVideo').hidden = !ALL_VIDEOS.length;
  document.getElementById('tracklistSection').hidden = false;
  document.getElementById('tlSort').hidden = activeTab === 'music';
  renderGenreChips();
  renderTracks();
});

document.getElementById('tlSearch').addEventListener('input', (e) => {
  radioMode = false;
  tlState.query = e.target.value.trim().toLowerCase();
  renderTracks();
});
document.getElementById('tlSort').addEventListener('change', (e) => {
  radioMode = false;
  tlState.sort = e.target.value;
  renderTracks();
});
document.getElementById('radioBtn').addEventListener('click', startRadio);
</script>
