<style>
  :root {
    --ink:        #eef2f6;
    --ink-soft:   #a9b6c5;
    --paper:      #10151d;
    --paper-alt:  #182029;
    --line:       rgba(255,255,255,0.10);
    --card:       #1a222c;
    --accent:     #d8268c;
    --font-display: "Baloo 2", ui-rounded, "Segoe UI", sans-serif;
    --font-body:    "Karla", "Segoe UI", Arial, sans-serif;
    --font-mono:    "Space Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
  body { overflow-x: hidden; position: relative; }

  .aurora {
    position: fixed; left: 50%; top: 50%; width: 90vw; height: 90vw; max-width: 900px; max-height: 900px;
    transform: translate(-50%, -50%); z-index: 0; overflow: visible; pointer-events: none; filter: blur(60px);
  }
  .blob { position: absolute; inset: 0; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); will-change: transform; }
  .blob span {
    position: absolute; top: 50%; left: 50%; opacity: 0.65; mix-blend-mode: screen;
    animation: cloudMorph 10s ease-in-out infinite, cloudDrift 14s ease-in-out infinite;
  }
  .blob:nth-child(1) span {
    width: 30%; height: 30%; margin: -21% 0 0 -26%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), #d8268c 55%, transparent 78%);
    animation-delay: 0s, 0s;
  }
  .blob:nth-child(2) span {
    width: 24%; height: 24%; margin: -8% 0 0 6%;
    background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.9), #4c1d95 55%, transparent 78%);
    animation-delay: -1.5s, -2s;
  }
  .blob:nth-child(3) span {
    width: 26%; height: 26%; margin: 4% 0 0 -20%;
    background: radial-gradient(circle at 45% 45%, rgba(255,255,255,0.9), #7c3aed 55%, transparent 78%);
    animation-delay: -3s, -4s;
  }
  .blob:nth-child(4) span {
    width: 20%; height: 20%; margin: -22% 0 0 4%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), #b91c6b 55%, transparent 78%);
    animation-delay: -4.5s, -6s;
  }
  .blob:nth-child(5) span {
    width: 22%; height: 22%; margin: 8% 0 0 2%;
    background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.9), #4c1d95 55%, transparent 78%);
    animation-delay: -6s, -8s;
  }
  .blob:nth-child(6) span {
    width: 18%; height: 18%; margin: -10% 0 0 -34%;
    background: radial-gradient(circle at 45% 45%, rgba(255,255,255,0.9), #d8268c 55%, transparent 78%);
    animation-delay: -7.5s, -10s;
  }
  .blob:nth-child(7) span {
    width: 20%; height: 20%; margin: 12% 0 0 -8%;
    background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.9), #7c3aed 55%, transparent 78%);
    animation-delay: -9s, -12s;
  }
  @keyframes cloudMorph {
    0%, 100% { border-radius: 42% 58% 61% 39% / 41% 39% 61% 59%; }
    33%      { border-radius: 61% 39% 30% 70% / 60% 32% 68% 40%; }
    66%      { border-radius: 30% 70% 70% 30% / 52% 62% 38% 48%; }
  }
  @keyframes cloudDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(9%, -12%) scale(1.22); }
  }

  .topbar, .hero, .player, .tracklist-section, .links-section, footer { position: relative; z-index: 1; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 0; max-width: 900px; margin: 0 auto; }
  .backlink {
    font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-soft); text-decoration: none;
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; transition: color 0.15s ease, border-color 0.15s ease;
  }
  .backlink:hover { color: var(--ink); border-color: rgba(255,255,255,0.4); }
  .topbar select {
    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 12px; font-family: var(--font-mono); font-size: 0.82rem; cursor: pointer;
  }
  .topbar select:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hero { text-align: center; padding: 28px 24px 40px; max-width: 720px; margin: 0 auto; }
  .hero .picon { font-size: 3.4rem; display: block; margin-bottom: 6px; animation: iconFloat 5s ease-in-out infinite; }
  @keyframes iconFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(-3deg); } }
  .hero h1 {
    font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 6vw, 2.8rem); margin: 0 0 12px;
    letter-spacing: -0.01em; animation: heroGlow 4s ease-in-out infinite;
  }
  @keyframes heroGlow {
    0%, 100% { text-shadow: 0 0 18px rgba(216,38,140,0.55), 0 0 4px rgba(216,38,140,0.35); }
    50%      { text-shadow: 0 0 18px rgba(124,58,237,0.6), 0 0 4px rgba(124,58,237,0.4); }
  }
  .hero p { color: var(--ink-soft); font-size: 1.08rem; margin: 0; line-height: 1.6; }

  .player { max-width: 860px; margin: 0 auto; padding: 0 24px; }
  .now-playing-label {
    font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-soft); margin: 0 0 8px;
  }
  .now-playing-label b { color: var(--ink); font-weight: 700; }
  .player-frame {
    position: relative; width: 100%; padding-top: 56.25%; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line); background: var(--card); box-shadow: 0 14px 34px rgba(0,0,0,0.45);
  }
  .player-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 18px; }
  .btn {
    font-family: var(--font-mono); font-size: 0.86rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    text-decoration: none; padding: 13px 22px; border-radius: 10px; display: inline-flex; align-items: center; gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-music { color: #fff; background: linear-gradient(135deg, #d8268c, #7c3aed); box-shadow: 0 8px 22px rgba(216,38,140,0.35); }
  .btn-music:hover { box-shadow: 0 12px 28px rgba(216,38,140,0.5); }

  .tracklist-section { max-width: 860px; margin: 34px auto 0; padding: 0 24px; }
  .tl-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .tl-search {
    flex: 1; min-width: 160px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-family: var(--font-body); font-size: 0.88rem;
  }
  .tl-search::placeholder { color: var(--ink-soft); }
  .tl-search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tl-sort {
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font-family: var(--font-mono); font-size: 0.78rem; cursor: pointer;
  }
  .tl-genres { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tl-chip {
    padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
    color: var(--ink-soft); font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 0.03em; cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .tl-chip:hover { border-color: rgba(255,255,255,0.4); color: var(--ink); }
  .tl-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tl-count { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft); margin: 0 0 10px; }

  .track-list { display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px; }
  .track-row {
    display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; border: none;
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; width: 100%;
    transition: background 0.15s ease;
  }
  .track-row:hover { background: rgba(255,255,255,0.06); }
  .track-row.active { background: rgba(216,38,140,0.14); }
  .track-row.active .track-title { color: var(--accent); }
  .track-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--paper-alt); }
  .track-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .track-title { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-genre-pill {
    align-self: flex-start; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,0.08);
    font-family: var(--font-mono); font-size: 0.65rem; color: var(--ink-soft); text-transform: uppercase;
  }
  .track-stats {
    display: flex; gap: 12px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft);
    flex-shrink: 0; white-space: nowrap;
  }
  .track-empty { padding: 28px 8px; text-align: center; color: var(--ink-soft); font-family: var(--font-mono); font-size: 0.82rem; }
  .tl-more {
    display: inline-block; margin-top: 6px; font-family: var(--font-mono); font-size: 0.78rem;
    color: var(--ink-soft); text-decoration: none; border-bottom: 1px dashed var(--line);
  }
  .tl-more:hover { color: var(--ink); }

  .links-section { max-width: 860px; margin: 40px auto 0; padding: 0 24px 64px; }
  .links-heading {
    font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-soft); margin: 0 0 14px;
  }
  .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .link-card {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--ink); text-decoration: none;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .link-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.5); }
  .link-icon { font-size: 1.25rem; flex-shrink: 0; }
  .link-label { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700; }

  footer { border-top: 1px solid var(--line); padding: 32px 24px 48px; text-align: center; }
  footer p { color: var(--ink-soft); font-family: var(--font-mono); font-size: 0.85rem; margin: 0 0 6px; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .aurora .blob span, .hero h1, .hero .picon { animation: none !important; }
  }
</style>
</head>

  linkPortfolio: { pt:'Outros Projetos', en:'Other Projects', es:'Otros Proyectos', fr:'Autres Projets', de:'Weitere Projekte', it:'Altri Progetti', pl:'Inne Projekty', ja:'その他のプロジェクト', nl:'Andere Projecten', cs:'Další Projekty', zh:'其他项目', ru:'Другие Проекты', ko:'다른 프로젝트', ne:'अन्य परियोजनाहरू' },
  footerContact: { pt:'Contacto', en:'Contact', es:'Contacto', fr:'Contact', de:'Kontakt', it:'Contatto', pl:'Kontakt', ja:'連絡先', nl:'Contact', cs:'Kontakt', zh:'联系方式', ru:'Контакт', ko:'연락처', ne:'सम्पर्क' }
};

let currentLang = 'pt';
let ALL_VIDEOS = [];
let activeVideoId = '3h8GwUbCsbE';
const tlState = { query: '', genre: 'all', sort: 'newest' };

function setLang(lang) {
  if (!LANG_ORDER.includes(lang)) lang = 'pt';
  currentLang = lang;
  document.documentElement.lang = lang;

  document.getElementById('heroTagline').textContent = T.heroTagline[lang];
  document.getElementById('ctaBack').textContent = T.ctaBack[lang];
  document.getElementById('ctaMusic').textContent = T.ctaMusic[lang];
  document.getElementById('nowPlayingPrefix').textContent = T.nowPlayingPrefix[lang];
  document.getElementById('tlSearch').placeholder = T.searchPlaceholder[lang];
  document.getElementById('sortNewest').textContent = T.sortNewest[lang];
  document.getElementById('sortViews').textContent = T.sortViews[lang];
  document.getElementById('sortLikes').textContent = T.sortLikes[lang];
  document.getElementById('tlMore').textContent = T.tlMore[lang];
  document.getElementById('linksHeading').textContent = T.linksHeading[lang];
  document.getElementById('linkPortfolioLabel').textContent = T.linkPortfolio[lang];
  document.getElementById('footerContact').textContent = T.footerContact[lang];

  const sel = document.getElementById('langSelect');
  if (sel && sel.value !== lang) sel.value = lang;
  try { localStorage.setItem('yoluha-lang', lang); } catch (e) {}

  renderTracks();
}

(function () {
  const sel = document.getElementById('langSelect');
  sel.innerHTML = LANG_ORDER.map(code => `<option value="${code}">${LANG_NAMES[code]}</option>`).join('');

  var saved = null;
  try { saved = localStorage.getItem('yoluha-lang'); } catch (e) {}
  var browserLang = (navigator.language || 'pt').slice(0, 2);
  var initial = saved || (LANG_ORDER.includes(browserLang) ? browserLang : 'pt');
  setLang(initial);
})();

(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const blobs = Array.from(document.querySelectorAll('.aurora .blob'));
  if (!blobs.length) return;

  const PUSH_RADIUS = 200;
  const PUSH_STRENGTH = 90;
  let homes = [];

  function measureHomes() {
    homes = blobs.map(el => {
      const r = (el.querySelector('span') || el).getBoundingClientRect();
      return { el, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
    });
  }
  measureHomes();
  window.addEventListener('resize', measureHomes);

  function pushFrom(px, py) {
    homes.forEach(h => {
      const dx = h.cx - px;
      const dy = h.cy - py;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist < PUSH_RADIUS) {
        const force = (1 - dist / PUSH_RADIUS) * PUSH_STRENGTH;
        h.el.style.transform = `translate(${(dx / dist) * force}px, ${(dy / dist) * force}px)`;
      } else {
        h.el.style.transform = 'translate(0, 0)';
      }
    });
  }
  function release() {
    homes.forEach(h => { h.el.style.transform = 'translate(0, 0)'; });
  }

  window.addEventListener('mousemove', (e) => pushFrom(e.clientX, e.clientY));
  window.addEventListener('mouseleave', release);
  window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) pushFrom(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchend', release);
})();

// ---------- Track list ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function formatCount(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

function playVideo(id, title) {
  activeVideoId = id;
  document.getElementById('playerFrame').src = `https://www.youtube.com/embed/${id}`;
  document.getElementById('nowPlayingTitle').textContent = title;
  document.querySelector('.player').scrollIntoView({ behavior: 'smooth', block: 'start' });
  renderTracks();
}

function renderTracks() {
  const list = document.getElementById('trackList');
  const countEl = document.getElementById('tlCount');
  if (!list) return;

  let items = ALL_VIDEOS.filter(v => {
    if (tlState.genre !== 'all' && v.genre !== tlState.genre) return false;
    if (tlState.query && !v.title.toLowerCase().includes(tlState.query)) return false;
    return true;
  });
  items.sort((a, b) => {
    if (tlState.sort === 'views') return (b.views || 0) - (a.views || 0);
    if (tlState.sort === 'likes') return (b.likes || 0) - (a.likes || 0);
    return new Date(b.published || 0) - new Date(a.published || 0);
  });

  countEl.textContent = `${items.length} / ${ALL_VIDEOS.length}`;
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = `<p class="track-empty">${T.trackEmpty[currentLang]}</p>`;
    return;
  }
  items.forEach(v => {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'track-row' + (v.id === activeVideoId ? ' active' : '');
    row.innerHTML = `
      <img class="track-thumb" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy">
      <span class="track-main">
        <span class="track-title">${escapeHtml(v.title)}</span>
        ${v.genre ? `<span class="track-genre-pill">${escapeHtml(v.genre)}</span>` : ''}
      </span>
      <span class="track-stats">👁 ${formatCount(v.views || 0)} · ♥ ${formatCount(v.likes || 0)}</span>
    `;
    row.addEventListener('click', () => playVideo(v.id, v.title));
    list.appendChild(row);
  });
}

function renderGenreChips() {
  const wrap = document.getElementById('tlGenres');
  const genres = Array.from(new Set(ALL_VIDEOS.map(v => v.genre).filter(Boolean)));
  if (genres.length < 2) { wrap.hidden = true; return; }
  wrap.hidden = false;
  wrap.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.type = 'button';
  allChip.className = 'tl-chip active';
  allChip.textContent = T.allGenres[currentLang];
  allChip.dataset.genre = 'all';
  wrap.appendChild(allChip);
  genres.forEach(g => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'tl-chip';
    chip.textContent = g;
    chip.dataset.genre = g;
    wrap.appendChild(chip);
  });
  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.tl-chip');
    if (!btn) return;
    tlState.genre = btn.dataset.genre;
    wrap.querySelectorAll('.tl-chip').forEach(c => c.classList.toggle('active', c === btn));
    renderTracks();
  });
}

fetch('videos.json').then(r => r.ok ? r.json() : []).then(videos => {
  if (!Array.isArray(videos) || !videos.length) return;
  ALL_VIDEOS = videos;
  document.getElementById('tracklistSection').hidden = false;
  renderGenreChips();
  renderTracks();
}).catch(() => {});

document.getElementById('tlSearch').addEventListener('input', (e) => {
  tlState.query = e.target.value.trim().toLowerCase();
  renderTracks();
});
document.getElementById('tlSort').addEventListener('change', (e) => {
  tlState.sort = e.target.value;
  renderTracks();
});
</script>
